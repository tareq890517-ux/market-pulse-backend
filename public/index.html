<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نبض السوق</title>
<style>
:root{--bg:#0E1A22;--el:#142530;--el2:#1B2F3C;--ln:#26404F;--tx:#E7EEF2;--dim:#8FA6B2;--am:#D9A441;--gr:#4CAF7D;--rd:#D9615C}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:sans-serif;line-height:1.6}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--ln)}
h1{font-size:18px}
.tick-wrap{overflow:hidden;white-space:nowrap;padding:8px 0;background:var(--el);border-bottom:1px solid var(--ln)}
.tick{display:inline-flex;gap:30px;animation:sc 30s linear infinite;padding-right:100%}
@keyframes sc{from{transform:translateX(0)}to{transform:translateX(-100%)}}
main{max-width:700px;margin:0 auto;padding:24px 16px}
.box{border:1px solid var(--ln);background:var(--el);padding:20px;margin-bottom:20px}
h2{font-size:18px;margin-bottom:6px}
p.sub{color:var(--dim);font-size:13px;margin-bottom:16px}
.up{border:1.5px dashed var(--ln);padding:20px;text-align:center;cursor:pointer;font-size:13px}
input,button,select{width:100%;background:var(--bg);border:1px solid var(--ln);color:var(--tx);padding:10px;margin-bottom:10px;font-size:14px}
button{background:var(--am);color:#141008;font-weight:600;border:none;cursor:pointer}
button.gh{background:transparent;color:var(--dim);border:1px solid var(--ln)}
.gate{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;align-items:center;justify-content:center;padding:20px}
.hide{display:none}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln);font-size:14px;gap:10px}
.row span:first-child{color:var(--dim);white-space:nowrap}
.row span:last-child{text-align:left}
.err{color:var(--rd);font-size:12px;margin-top:8px}
img.pv{width:60px;height:40px;object-fit:cover;border:1px solid var(--ln)}
a{color:var(--am)}
.slot{display:flex;align-items:center;gap:8px;border:1px solid var(--ln);padding:8px;margin-bottom:8px}
.slot select{width:100px;margin:0}
.slot .name{flex:1;font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot button{width:auto;background:none;color:var(--rd);border:none;padding:0 6px;font-size:16px}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="box" style="width:100%;max-width:360px">
    <h2 id="aT" data-t="createAccount">إنشاء حساب</h2>
    <p class="sub" id="aS" data-t="oneFree">تحليل واحد مجاني</p>
    <div id="nameF"><input id="nm" placeholder="الاسم" data-tp="name"></div>
    <input id="em" placeholder="البريد الإلكتروني" type="email" data-tp="email">
    <input id="pw" placeholder="كلمة المرور" type="password" data-tp="password">
    <button id="go" data-t="createAccountBtn">إنشاء الحساب</button>
    <div class="err hide" id="er"></div>
    <p class="sub"><span id="tt" data-t="haveAccount">لديك حساب؟</span> <a href="#" id="tg" data-t="login">دخول</a></p>
  </div>
</div>

<div id="app" class="hide">
<header>
  <h1 id="brandTitle">نبض السوق</h1>
  <div>
    <button id="langBtn" style="width:auto;background:none;color:var(--am);border:1px solid var(--ln);padding:4px 8px;font-size:12px;margin-left:8px">EN</button>
    <span id="who" style="font-size:13px;color:var(--dim)"></span>
    <button id="out" style="width:auto;background:none;color:var(--dim);text-decoration:underline;padding:4px" data-t="logout">خروج</button>
  </div>
</header>
<div class="tick-wrap"><div class="tick" id="tk">جاري التحميل...</div></div>

<main>
  <div class="box">
    <h2 data-t="analyzeTitle">حلّل الشارت</h2>
    <p class="sub" id="usage"></p>

    <div id="slots"></div>
    <button class="gh" id="addSlot" data-t="addFrame">+ إضافة فريم (صورة)</button>
    <input type="file" id="fi" accept="image/*" class="hide">

    <button id="an" style="margin-top:12px" data-t="analyzeNow">حلّل الآن</button>

    <div id="pay" class="hide box" style="margin-top:10px">
      <p style="text-align:center;margin-bottom:14px" data-t="freeEnded">انتهت تحليلاتك المجانية — اشترك للمتابعة</p>

      <select id="planSel">
        <option value="1m">شهر واحد — 20$</option>
        <option value="2m">شهرين — 35$</option>
        <option value="6m">ستة أشهر — 100$</option>
        <option value="1y">سنة كاملة — 150$</option>
      </select>

      <select id="methodSel">
        <option value="BTC">الدفع بـ Bitcoin (BTC)</option>
        <option value="USDT">الدفع بـ USDT (BEP20)</option>
      </select>

      <div class="box" style="background:var(--bg);word-break:break-all;font-size:12px;margin-bottom:10px">
        <div id="walletLabel" style="color:var(--dim);margin-bottom:4px">عنوان محفظة BTC:</div>
        <div id="walletAddr" style="color:var(--am)"></div>
      </div>
      <p class="sub">حوّل المبلغ المطابق للباقة المختارة للعنوان أعلاه، ثم أدخل رقم عملية التحويل (Transaction Hash) بالأسفل.</p>

      <input id="txHash" placeholder="رقم عملية التحويل (Tx Hash)" data-tp="txHash">
      <button id="submitPay" data-t="submitPay">إرسال طلب التفعيل</button>
      <div id="payMsg" class="sub" style="margin-top:8px"></div>
    </div>
    <div id="load" class="hide sub">جاري التحليل...</div>
    <div id="res" class="hide"></div>
  </div>
</main>
</div>

<script>
const API = '';
let token = null, uc = 0, sub = false, login = false;
let frames = []; // {label, base64, mediaType, name}

const gate=document.getElementById('gate'), app=document.getElementById('app');
const er=document.getElementById('er');
const TF_OPTIONS = [['5m','5 دقائق'],['15m','15 دقيقة'],['1h','ساعة'],['4h','4 ساعات'],['1D','يوم'],['1W','أسبوع']];

document.getElementById('tg').onclick = e => {
  e.preventDefault();
  login = !login;
  document.getElementById('nameF').style.display = login ? 'none' : 'block';
  document.getElementById('aT').textContent = login ? 'تسجيل الدخول' : 'إنشاء حساب';
  document.getElementById('go').textContent = login ? 'دخول' : 'إنشاء الحساب';
  document.getElementById('tt').textContent = login ? 'ما عندك حساب؟' : 'لديك حساب؟';
  document.getElementById('tg').textContent = login ? 'إنشاء حساب' : 'دخول';
};

async function check(){
  try{
    const savedToken = localStorage.getItem('tok');
    if(savedToken){
      token = savedToken;
      const m = await fetch(API+'/api/me',{headers:{Authorization:'Bearer '+token}});
      if(m.ok){ showApp(await m.json()); return; }
    }
  }catch(e){}
  gate.style.display='flex'; app.classList.add('hide');
}

function showApp(u){
  gate.style.display='none'; app.classList.remove('hide');
  document.getElementById('who').textContent = u.name;
  uc = u.analysis_count; sub = u.is_subscribed;
  renderU();
}

const goBtn = document.getElementById('go');
goBtn.onclick = async ()=>{
  er.classList.add('hide');
  const name=document.getElementById('nm').value.trim();
  const email=document.getElementById('em').value.trim();
  const pw=document.getElementById('pw').value;
  if(!email||!pw||(!login&&!name)){ er.textContent='عبّئ كل الحقول'; er.classList.remove('hide'); return; }

  const originalText = goBtn.textContent;
  goBtn.disabled = true;
  goBtn.textContent = 'جاري الاتصال بالسيرفر... (قد يستغرق حتى 50 ثانية عند أول استخدام)';

  try{
    const ep = login?'/api/auth/login':'/api/auth/signup';
    const body = login?{email,password:pw}:{name,email,password:pw};
    const r = await fetch(API+ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d = await r.json();
    if(!r.ok){ er.textContent=d.error||'خطأ'; er.classList.remove('hide'); return; }
    token=d.token;
    try{localStorage.setItem('tok',token);}catch(e){}
    showApp(d.user);
  }catch(e){ er.textContent='تعذّر الاتصال بالسيرفر، تأكد من الإنترنت وحاول مرة أخرى'; er.classList.remove('hide'); }
  finally{
    goBtn.disabled = false;
    goBtn.textContent = originalText;
  }
};

document.getElementById('out').onclick = async ()=>{
  try{localStorage.removeItem('tok');}catch(e){}
  token=null; app.classList.add('hide'); gate.style.display='flex';
};

function renderU(){
  const t = TRANSLATIONS[currentLang];
  document.getElementById('usage').textContent = sub ? t.activeSub : `${Math.max(1-uc,0)} ${t.remaining1}`;
}

function renderSlots(){
  const wrap = document.getElementById('slots');
  wrap.innerHTML = '';
  frames.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'slot';
    const sel = document.createElement('select');
    TF_OPTIONS.forEach(([v,l]) => {
      const o = document.createElement('option');
      o.value = v; o.textContent = l;
      if (v === f.label) o.selected = true;
      sel.appendChild(o);
      });
    sel.onchange = () => { frames[i].label = sel.value; };
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = f.name;
    const rm = document.createElement('button');
    rm.textContent = '✕';
    rm.onclick = () => { frames.splice(i,1); renderSlots(); };
    div.appendChild(sel); div.appendChild(name); div.appendChild(rm);
    wrap.appendChild(div);
  });
}

document.getElementById('addSlot').onclick = () => {
  if (frames.length >= 6) { alert('الحد الأقصى 6 فريمات'); return; }
  document.getElementById('fi').click();
};

// نضغط الصورة قبل الإرسال (أبعاد أصغر + جودة JPEG معقولة) لتفادي تجاوز حجم الطلب
// عند رفع عدة فريمات مع بعض
function compressImage(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        const maxW = 1280;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
        resolve({ base64: dataUrl.split(',')[1], mediaType: 'image/jpeg' });
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('fi').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try{
    const { base64, mediaType } = await compressImage(f);
    frames.push({ label: '1h', base64, mediaType, name: f.name });
    renderSlots();
    document.getElementById('res').classList.add('hide');
  }catch(err){
    alert('تعذّر معالجة الصورة، جرّب صورة أخرى');
  }
  e.target.value = '';
};

document.getElementById('an').onclick = async ()=>{
  if (frames.length === 0){ alert('أضف فريم واحد على الأقل'); return; }
  document.getElementById('load').classList.remove('hide');
  document.getElementById('res').classList.add('hide');
  document.getElementById('pay').classList.add('hide');
  try{
    const images = frames.map(f => ({ imageBase64: f.base64, mediaType: f.mediaType, label: f.label }));
    const r = await fetch(API+'/api/analyze',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({images})});
    const d = await r.json();
    if(r.status===402){ document.getElementById('load').classList.add('hide'); document.getElementById('pay').classList.remove('hide'); return; }
    if(!r.ok) throw new Error(d.error);
    if(typeof d.remaining==='number') uc = 1-d.remaining;
    renderU();
    const p = d.analysis;
    document.getElementById('res').innerHTML = `
      <div class="row"><span>النمط</span><span>${p.pattern||'-'}</span></div>
      <div class="row"><span>ملخص الفريمات</span><span>${p.timeframes_summary||'-'}</span></div>
      <div class="row"><span>الاتجاه العام</span><span>${p.overall_trend||'-'}</span></div>
      <div class="row"><span>فيبوناتشي</span><span>${p.fibonacci_level||'-'}</span></div>
      <div class="row"><span>المؤشرات</span><span>${p.indicators_used||'-'}</span></div>
      <div class="row"><span>دعم/مقاومة</span><span>${p.support||'-'} / ${p.resistance||'-'}</span></div>
      <div class="row"><span>دخول مقترح</span><span>${p.entry||'-'}</span></div>
      <div class="row"><span>وقف الخسارة</span><span style="color:var(--rd)">${p.stop_loss||'-'}</span></div>
      <div class="row"><span>جني الأرباح</span><span style="color:var(--gr)">${p.take_profit||'-'}</span></div>
      <div class="row"><span>درجة الخطورة</span><span>${p.risk_level||'-'}</span></div>
      <div class="row"><span>ثقة النمط</span><span>${p.confidence||'-'}</span></div>
    `;
    document.getElementById('load').classList.add('hide');
    document.getElementById('res').classList.remove('hide');
  }catch(e){
    document.getElementById('load').classList.add('hide');
    document.getElementById('res').classList.remove('hide');
    document.getElementById('res').textContent = 'تعذّر التحليل، حاول مرة أخرى (قد يكون السيرفر يستيقظ، انتظر دقيقة)';
  }
};

async function ticker(){
  try{
    const r = await fetch(API+'/api/prices');
    const d = await r.json();
    const all = [...(d.crypto||[]),...(d.forex||[])];
    const html = all.map(x=>`<span>${x.symbol} ${x.price.toLocaleString()}</span>`).join(' &nbsp; ');
    document.getElementById('tk').innerHTML = html + ' &nbsp; ' + html;
  }catch(e){
    document.getElementById('tk').textContent = 'تعذّر جلب الأسعار';
  }
}

const WALLETS = {
  BTC: '12QcTFBrWsd2YSrRdoZVbnNdJDGVsdo91Z',
  USDT: '0x827ed8494712c2b1bba8d0ca336c961220bab24f'
};

function updateWalletDisplay(){
  const t = TRANSLATIONS[currentLang];
  const method = document.getElementById('methodSel').value;
  document.getElementById('walletLabel').textContent = method === 'BTC' ? t.btcWallet : t.usdtWallet;
  document.getElementById('walletAddr').textContent = WALLETS[method];
}
document.getElementById('methodSel').addEventListener('change', updateWalletDisplay);
updateWalletDisplay();

document.getElementById('submitPay').onclick = async ()=>{
  const method = document.getElementById('methodSel').value;
  const tx_hash = document.getElementById('txHash').value.trim();
  const msg = document.getElementById('payMsg');
  if(!tx_hash){ msg.textContent = 'أدخل رقم عملية التحويل'; msg.style.color = 'var(--rd)'; return; }
  try{
    const r = await fetch(API+'/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({method,tx_hash})});
    const d = await r.json();
    if(!r.ok){ msg.textContent = d.error||'خطأ'; msg.style.color = 'var(--rd)'; return; }
    msg.textContent = d.message;
    msg.style.color = 'var(--gr)';
    document.getElementById('txHash').value = '';
  }catch(e){ msg.textContent = 'تعذّر الاتصال بالسيرفر'; msg.style.color = 'var(--rd)'; }
};

const TRANSLATIONS = {
  ar: {
    brandTitle: 'نبض السوق', logout: 'خروج', createAccount: 'إنشاء حساب',
    oneFree: 'تحليل واحد مجاني', createAccountBtn: 'إنشاء الحساب', haveAccount: 'لديك حساب؟', login: 'دخول',
    analyzeTitle: 'حلّل الشارت', addFrame: '+ إضافة فريم (صورة)', analyzeNow: 'حلّل الآن',
    submitPay: 'إرسال طلب التفعيل', freeEnded: 'انتهت تحليلاتك المجانية — اشترك للمتابعة',
    name: 'الاسم', email: 'البريد الإلكتروني', password: 'كلمة المرور', txHash: 'رقم عملية التحويل (Tx Hash)',
    loginTitle: 'تسجيل الدخول', loginSub: 'أهلاً بعودتك', noAccount: 'ما عندك حساب؟', newAccount: 'إنشاء حساب جديد', activeSub: 'اشتراك نشط', remaining1: 'من 1 تحليل متبقي', remaining0: 'من 1 تحليل متبقي', btcWallet: 'عنوان محفظة BTC:', usdtWallet: 'عنوان محفظة USDT (BEP20):',
  },
  en: {
    brandTitle: 'Market Pulse', logout: 'Logout', createAccount: 'Create Account',
    oneFree: 'One free analysis', createAccountBtn: 'Create Account', haveAccount: 'Have an account?', login: 'Login',
    analyzeTitle: 'Analyze Chart', addFrame: '+ Add Timeframe (image)', analyzeNow: 'Analyze Now',
    submitPay: 'Submit Activation Request', freeEnded: 'Your free analysis is used — subscribe to continue',
    name: 'Name', email: 'Email', password: 'Password', txHash: 'Transaction Hash',
    loginTitle: 'Login', loginSub: 'Welcome back', noAccount: "Don't have an account?", newAccount: 'Create new account', activeSub: 'Active subscription', remaining1: 'of 1 free analysis left', remaining0: 'of 1 free analysis left', btcWallet: 'BTC Wallet Address:', usdtWallet: 'USDT (BEP20) Wallet Address:',
  }
};

let currentLang = 'ar';

function applyLang(){
  const t = TRANSLATIONS[currentLang];
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('langBtn').textContent = currentLang === 'ar' ? 'EN' : 'عربي';

  document.querySelectorAll('[data-t]').forEach(el => {
    const key = el.getAttribute('data-t');
    if (t[key]) el.textContent = t[key];
  });
  document.querySelectorAll('[data-tp]').forEach(el => {
    const key = el.getAttribute('data-tp');
    if (t[key]) el.placeholder = t[key];
  });

  if (login){
    document.getElementById('aT').textContent = t.loginTitle;
    document.getElementById('go').textContent = t.login;
    document.getElementById('tt').textContent = t.noAccount;
    document.getElementById('tg').textContent = t.newAccount;
  }
  renderU();
  updateWalletDisplay();
}

document.getElementById('langBtn').onclick = () => {
  currentLang = currentLang === 'ar' ? 'en' : 'ar';
  applyLang();
};

check();
applyLang();
ticker();
setInterval(ticker,60000);
</script>
</body>
</html>
