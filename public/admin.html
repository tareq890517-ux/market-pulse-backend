<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المالك — نبض السوق</title>
<style>
:root{--bg:#0E1A22;--el:#142530;--ln:#26404F;--tx:#E7EEF2;--dim:#8FA6B2;--am:#D9A441;--gr:#4CAF7D;--rd:#D9615C}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:sans-serif;padding:20px}
h1{font-size:20px;margin-bottom:20px}
h2{font-size:15px;margin:20px 0 10px;color:var(--dim)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.card{border:1px solid var(--ln);background:var(--el);padding:16px}
.card .n{font-size:24px;font-weight:700;color:var(--am)}
.card .l{font-size:12px;color:var(--dim);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:20px}
th,td{padding:6px;text-align:right;border-bottom:1px solid var(--ln)}
th{color:var(--dim);font-weight:600}
.sub{color:var(--gr)}
.pending{color:var(--am)}
.rejected{color:var(--rd)}
.msg{padding:20px;text-align:center;color:var(--dim)}
button{background:var(--am);color:#141008;border:none;padding:5px 10px;font-size:11px;cursor:pointer;margin:2px}
button.rej{background:var(--rd);color:#fff}
button.rev{background:transparent;color:var(--dim);border:1px solid var(--ln)}
button.del{background:transparent;color:var(--rd);border:1px solid var(--rd)}
</style>
</head>
<body>

<h1>لوحة تحكم المالك</h1>
<div id="content"><div class="msg">جاري التحميل...</div></div>

<script>
const token = localStorage.getItem('tok');
const H = { Authorization: 'Bearer ' + token };

async function loadAll(){
  const c = document.getElementById('content');
  if(!token){ c.innerHTML = '<div class="msg">سجّل دخولك أولاً من الصفحة الرئيسية</div>'; return; }

  try{
    const [statsRes, subsRes] = await Promise.all([
      fetch('/api/admin/stats', { headers: H }),
      fetch('/api/admin/subscriptions', { headers: H }),
    ]);

    if(statsRes.status === 403){ c.innerHTML = '<div class="msg">هذه الصفحة للمالك فقط</div>'; return; }
    if(!statsRes.ok || !subsRes.ok){ c.innerHTML = '<div class="msg">تعذّر التحميل</div>'; return; }

    const stats = await statsRes.json();
    const subs = await subsRes.json();

    let html = `<div class="cards">
      <div class="card"><div class="n">${stats.total_users}</div><div class="l">إجمالي المستخدمين</div></div>
      <div class="card"><div class="n">${stats.subscribed_users}</div><div class="l">مشتركين</div></div>
      <div class="card"><div class="n">${stats.total_analyses}</div><div class="l">إجمالي التحليلات</div></div>
    </div>`;

    html += '<h2>طلبات الاشتراك</h2><table><thead><tr><th>الاسم</th><th>طريقة</th><th>Hash</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>';
    subs.requests.forEach(s => {
      const statusClass = s.status === 'approved' ? 'sub' : s.status === 'rejected' ? 'rejected' : 'pending';
      const statusText = s.status === 'approved' ? 'مفعّل' : s.status === 'rejected' ? 'مرفوض' : 'معلّق';
      let actions = `<span class="${statusClass}">${statusText}</span>`;
      if (s.status === 'pending'){
        actions = `<button onclick="approveSub(${s.id})">تفعيل</button><button class="rej" onclick="rejectSub(${s.id})">رفض</button>`;
      }
      html += `<tr><td>${s.name}<br><small style="color:var(--dim)">${s.email}</small></td><td>${s.method}</td><td style="max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.tx_hash}</td><td>${actions}</td></tr>`;
    });
    html += '</tbody></table>';

    html += '<h2>المستخدمون</h2><table><thead><tr><th>الاسم</th><th>تحليلات</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>';
    stats.recent_users.forEach(u => {
      html += `<tr><td>${u.name}<br><small style="color:var(--dim)">${u.email}</small></td><td>${u.analysis_count}</td><td>${u.is_subscribed ? '<span class="sub">مشترك</span>' : 'مجاني'}</td><td>
        ${u.is_subscribed ? `<button class="rev" onclick="revokeUser(${u.id})">إلغاء الاشتراك</button>` : ''}
        <button class="del" onclick="deleteUser(${u.id})">حذف</button>
      </td></tr>`;
    });
    html += '</tbody></table>';

    c.innerHTML = html;
  }catch(e){
    c.innerHTML = '<div class="msg">خطأ في الاتصال بالسيرفر</div>';
  }
}

async function approveSub(id){
  await fetch(`/api/admin/subscriptions/${id}/approve`, { method: 'POST', headers: H });
  loadAll();
}
async function rejectSub(id){
  await fetch(`/api/admin/subscriptions/${id}/reject`, { method: 'POST', headers: H });
  loadAll();
}
async function revokeUser(id){
  if(!confirm('إلغاء اشتراك هذا المستخدم؟')) return;
  await fetch(`/api/admin/users/${id}/revoke`, { method: 'POST', headers: H });
  loadAll();
}
async function deleteUser(id){
  if(!confirm('حذف هذا الحساب نهائياً؟ لا يمكن التراجع.')) return;
  await fetch(`/api/admin/users/${id}`, { method: 'DELETE', headers: H });
  loadAll();
}

loadAll();
</script>
</body>
</html>
